# Test: Phrasing Slur Rendering
# Tests:
#   1) Simple slur over a small group of single notes (one voice)
#   2) Chord-spanning slur (outer-notehead anchoring)
#   3) Nested slurs (slurStarts: 2 / slurEnds: 2, plus a simultaneous close+open)
#   4) Wide arpeggio slur that should bow over intermediate noteheads (collision avoidance)
#   5) Two-voice slur direction: voice 1 → ABOVE, voice 2 → BELOW

