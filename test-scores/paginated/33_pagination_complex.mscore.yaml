# ── Staff Tracks ──────────────────────────────────────────────────────────────

staffTracks:
  st-violin:
    id: "st-violin"
    name: "Violin"
    clef: TREBLE
    keySignature:
      root: 0
      mode: MAJOR
    voiceTrackIds:
      - "vt-violin"
    staffLabel: "Violin"
    staffLabelAbbreviation: "Vln."

  st-piano-treble:
    id: "st-piano-treble"
    name: "Piano Treble"
    clef: TREBLE
    keySignature:
      root: 0
      mode: MAJOR
    voiceTrackIds:
      - "vt-piano-rh"
    attachments:
      # ── CROSS-PAGE crescendo: M8 beat 1 (page 1) → M9 beat 3 (page 2) ──────
      - type: dynamicMark
        id: "dyn-mp"
        onset: { components: [{ numerator: 8, denominator: 1 }, { numerator: 0, denominator: 4 }] }
        level: MP
        placement: BELOW
      - type: hairpin
        id: "hp-cresc"
        onset: { components: [{ numerator: 8, denominator: 1 }, { numerator: 0, denominator: 4 }] }
        endOnset: { components: [{ numerator: 9, denominator: 1 }, { numerator: 2, denominator: 4 }] }
        direction: CRESCENDO
        style: WEDGE
        placement: BELOW
      - type: dynamicMark
        id: "dyn-mf"
        onset: { components: [{ numerator: 9, denominator: 1 }, { numerator: 2, denominator: 4 }] }
        level: MF
        placement: BELOW
      # ── CROSS-PAGE 8va bracket: M8 beat 1 (page 1) → M9 beat 3 (page 2) ────
      - type: octaveShiftStart
        id: "osa-8va"
        onset: { components: [{ numerator: 8, denominator: 1 }, { numerator: 0, denominator: 4 }] }
        shiftType: OTTAVA
        endEventId: "ose-8va"
        placement: ABOVE
      - type: octaveShiftEnd
        id: "ose-8va"
        onset: { components: [{ numerator: 9, denominator: 1 }, { numerator: 2, denominator: 4 }] }
        placement: ABOVE
      # ── CROSS-PAGE diminuendo: M16 beat 1 (page 2) → M17 beat 3 (page 3) ───
      - type: dynamicMark
        id: "dyn-f"
        onset: { components: [{ numerator: 16, denominator: 1 }, { numerator: 0, denominator: 4 }] }
        level: F
        placement: BELOW
      - type: hairpin
        id: "hp-dim"
        onset: { components: [{ numerator: 16, denominator: 1 }, { numerator: 0, denominator: 4 }] }
        endOnset: { components: [{ numerator: 17, denominator: 1 }, { numerator: 2, denominator: 4 }] }
        direction: DIMINUENDO
        style: WEDGE
        placement: BELOW
      - type: dynamicMark
        id: "dyn-p"
        onset: { components: [{ numerator: 17, denominator: 1 }, { numerator: 2, denominator: 4 }] }
        level: P
        placement: BELOW

  st-piano-bass:
    id: "st-piano-bass"
    name: "Piano Bass"
    clef: BASS
    keySignature:
      root: 0
      mode: MAJOR
    voiceTrackIds:
      - "vt-piano-lh"
    attachments:
      # ── CROSS-PAGE 8vb bracket: M16 beat 1 (page 2) → M17 beat 3 (page 3) ──
      - type: octaveShiftStart
        id: "osa-8vb"
        onset: { components: [{ numerator: 16, denominator: 1 }, { numerator: 0, denominator: 4 }] }
        shiftType: OTTAVA_BASSA
        endEventId: "ose-8vb"
        placement: BELOW
      - type: octaveShiftEnd
        id: "ose-8vb"
        onset: { components: [{ numerator: 17, denominator: 1 }, { numerator: 2, denominator: 4 }] }
        placement: BELOW

# ── Staff Groups ──────────────────────────────────────────────────────────────
#
# Complex / nested staff header: outer SQUARE "Ensemble" spans Violin + Piano;
# inner BRACE "Piano" spans the grand staff. Both brackets + labels (and their
# abbreviations on restated systems) must repeat correctly on every system —
# including across page boundaries.

staffGroups:
  - id: "sg-ensemble"
    bracket: SQUARE
    label: "Ensemble"
    abbreviation: "Ens."
    barlineConnect: true
    members:
      - type: staff
        staffId: "st-violin"
      - type: group
        group:
          id: "sg-piano"
          bracket: BRACE
          label: "Piano"
          abbreviation: "Pno."
          barlineConnect: true
          members:
            - type: staff
              staffId: "st-piano-treble"
            - type: staff
              staffId: "st-piano-bass"

# ── Global Track — forced system / page breaks ───────────────────────────────
#
#   Lines:  [M1-4] [M5-8] [M9-12] [M13-16] [M17-20]
#   Pages:  page 1 = lines 1-2 (M1-8) · page 2 = lines 3-4 (M9-16) · page 3 = line 5 (M17-20)
#
# A page break also forces a system break at the same measure (see RuntimeScore),
# so M9 and M17 don't need separate systemBreak entries.

globalTrack:
  id: "gt-global"
  name: "Global"
  tempoEvents: []
  events:
    - type: systemBreak
      onset: { components: [{ numerator: 5, denominator: 1 }, { numerator: 0, denominator: 1 }] }
    - type: systemBreak
      onset: { components: [{ numerator: 13, denominator: 1 }, { numerator: 0, denominator: 1 }] }
    - type: pageBreak
      onset: { components: [{ numerator: 9, denominator: 1 }, { numerator: 0, denominator: 1 }] }
    - type: pageBreak
      onset: { components: [{ numerator: 17, denominator: 1 }, { numerator: 0, denominator: 1 }] }

pageLayout:
  paperWidthMm: 250.0
  paperHeightMm: 190.0
  marginTopMm: 12.0
  marginBottomMm: 12.0
  marginLeftMm: 12.0
  marginRightMm: 10.0
  staffSpaceMm: 1.4
  paginated: true
