# Test: Pagination — Complex Multi-Staff Layout & Cross-Page Spanners
#
# Tests:
#   1) Multi-line staff pagination with a complex staff header — nested brackets
#      (outer SQUARE "Ensemble" spanning Violin + Piano, inner BRACE "Piano"
#      spanning the grand staff) that must repeat correctly at the top of every
#      system, on every page.
#   2) Spanning elements that cross a PAGE boundary (not just a system boundary):
#        - Violin:      tie   M8 → M9   (page 1 → page 2, "test-tie")
#        - Violin:      slur  M16 → M17 (page 2 → page 3, "test-slur")
#        - Piano RH:    crescendo hairpin + 8va bracket  M8 → M9
#        - Piano RH:    diminuendo hairpin               M16 → M17
#        - Piano LH:    8vb bracket                      M16 → M17
#
# ── Layout plan (forced breaks) ──────────────────────────────────────────────
#   System breaks (line breaks):           before M5, M9, M13, M17
#   Page breaks (also force a line break):       before M9, M17
#   → Lines:  [M1-4] [M5-8] [M9-12] [M13-16] [M17-20]
#   → Pages:  page 1 = [M1-4, M5-8] · page 2 = [M9-12, M13-16] · page 3 = [M17-20]
#
# Every cross-page spanner above starts in the LAST measure of one page (M8 or
# M16) and resolves in the FIRST measure of the next page (M9 or M17).

