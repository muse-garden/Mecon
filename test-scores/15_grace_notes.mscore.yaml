# Test: Grace Notes — Basic Coverage
# Tests:
#   M1: single grace before principal  (stealFrom: PREVIOUS, totalDuration: EIGHTH)
#   M2: two graces before principal    (stealFrom: PREVIOUS, totalDuration: EIGHTH)
#   M3: three graces before principal  (stealFrom: PREVIOUS, totalDuration: EIGHTH)
#   M4: single grace, stealFrom: PRINCIPAL, totalDuration: EIGHTH
#   M5: two graces,   stealFrom: PRINCIPAL, totalDuration: EIGHTH
