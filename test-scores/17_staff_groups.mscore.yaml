# ── Staff Groups ───────────────────────────────────────────────────────────────
#
# sg-choir: SQUARE bracket spans soprano+alto, with group label "Choir".
#   barlineConnect:true means the vertical barline spans both staves.
#
# sg-piano: BRACE bracket spans piano treble+bass, with label "Piano".
#   barlineConnect:true means the vertical barline spans both staves.

staffGroups:
  - id: "sg-choir"
    bracket: SQUARE
    label: "Choir"
    abbreviation: "Chr."
    barlineConnect: true
    members:
      - type: staff
        staffId: "st-soprano"
      - type: staff
        staffId: "st-alto"

  - id: "sg-piano"
    bracket: BRACE
    label: "Piano"
    abbreviation: "Pno."
    barlineConnect: true
    members:
      - type: staff
        staffId: "st-piano-treble"
      - type: staff
        staffId: "st-piano-bass"

  # Nested bracket test: outer SQUARE spans all strings; inner BRACE spans Vln I + Vln II only.
  - id: "sg-strings"
    bracket: SQUARE
    label: "Strings"
    abbreviation: "Str."
    barlineConnect: true
    members:
      - type: group
        group:
          id: "sg-violins"
          bracket: BRACE
          label: ""
          abbreviation: ""
          barlineConnect: true
          members:
            - type: staff
              staffId: "st-vln1"
            - type: staff
              staffId: "st-vln2"

