# Test: Staff Header — Brackets, Labels, Barline Connectivity (including nested brackets)
#
# Layout:
#   [Choir]  [S.] ——————  soprano staff  —————— (barlines connect)
#   [sqbr.]  [A.] ——————   alto staff    ——————
#
#            [Pno.] ———— treble staff ————  (brace from partBracket auto-resolution)
#            [brace] ——— bass staff  ————
#
#   [Strings]  [Vln. I]  ——  violin I staff  ——  (nested: SQUARE outer + BRACE inner)
#   [ sqbr. ]  {brace}
#              [Vln. II] ——  violin II staff  ——
#
# Expected:
#   - "Choir" group label left of SQUARE bracket
#   - SQUARE bracket spanning soprano+alto staves
#   - per-staff labels "S." and "A." inside the bracket
#   - barlines connect soprano↔alto but break between alto↔piano
#   - Piano shows "Piano" instrument name and BRACE across treble+bass
#   - barlines connect treble↔bass within piano
#   - "Strings" label left of outer SQUARE bracket spanning Vln I + Vln II
#   - inner BRACE bracket spanning Vln I + Vln II (nested inside SQUARE)
#   - per-staff labels "Vln. I" and "Vln. II"
#   - barlines connect Vln I↔Vln II within strings

id: "test-staff-groups-001"

