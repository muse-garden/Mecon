# Test: Dynamics & Hairpins
# Tests:
#   M1) p (below) · mf (above) — basic placement with two voices.
#   M2) pp (below, beat 0) · crescendo WEDGE (beat 0–3):
#       START of hairpin coincides with pp → nudge test (same row expected).
#   M3) mp (below, beat 0) · ff (below, beat 2) + diminuendo WEDGE (beat 2–3):
#       START of dim hairpin coincides with ff → nudge test.
#   M4) fp (below, beat 0) · crescendo WEDGE (beat 0–2) · sfz (below, beat 2):
#       START of cresc coincides with fp AND END coincides with sfz → both-ends nudge.
#   M5) cresc. TEXT_DASHED — text + dashed line co-baseline check.
#   M6) dim.  TEXT_DASHED — mirrors M5 for diminuendo.
#
# Two voices per staff so vertical clearance between note content and
# dynamics bands can be verified.

