        level: FF
        placement: BELOW
        controllerEventId: "ctl-7"
      - type: hairpin
        id: "hp-dim"
        onset: { components: [{ numerator: 3, denominator: 1 }, { numerator: 2, denominator: 4 }] }
        endOnset: { components: [{ numerator: 3, denominator: 1 }, { numerator: 3, denominator: 4 }] }
        direction: DIMINUENDO
        style: WEDGE
        placement: BELOW
        controllerStartId: "ctl-8"
        controllerEndId: "ctl-9"
      # M4: fp (beat 0) · cresc WEDGE (beat 0→2) · sfz (beat 2)
      #   START of hairpin == fp onset  → start-nudge
      #   END   of hairpin == sfz onset → end-nudge
      - type: dynamicMark
        id: "dyn-fp"
        onset: { components: [{ numerator: 4, denominator: 1 }, { numerator: 0, denominator: 4 }] }
        level: FP
        placement: BELOW
        controllerEventId: "ctl-10"
      - type: hairpin
        id: "hp-cresc-m4"
        onset: { components: [{ numerator: 4, denominator: 1 }, { numerator: 0, denominator: 4 }] }
        endOnset: { components: [{ numerator: 4, denominator: 1 }, { numerator: 2, denominator: 4 }] }
        direction: CRESCENDO
        style: WEDGE
        placement: BELOW
        controllerStartId: "ctl-11"
        controllerEndId: "ctl-12"
      - type: dynamicMark
        id: "dyn-sfz"
        onset: { components: [{ numerator: 4, denominator: 1 }, { numerator: 2, denominator: 4 }] }
        level: SFZ
        placement: BELOW
        controllerEventId: "ctl-13"
      # M5: cresc. text + dashed line (TEXT_DASHED), below
      - type: hairpin
        id: "hp-cresc-text"
        onset: { components: [{ numerator: 5, denominator: 1 }, { numerator: 0, denominator: 4 }] }
        endOnset: { components: [{ numerator: 5, denominator: 1 }, { numerator: 3, denominator: 4 }] }
        direction: CRESCENDO
        style: TEXT_DASHED
        placement: BELOW
        controllerStartId: "ctl-14"
        controllerEndId: "ctl-15"
      # M6: dim. text + dashed line (TEXT_DASHED), below
      - type: hairpin
        id: "hp-dim-text"
        onset: { components: [{ numerator: 6, denominator: 1 }, { numerator: 0, denominator: 4 }] }
        endOnset: { components: [{ numerator: 6, denominator: 1 }, { numerator: 3, denominator: 4 }] }
        direction: DIMINUENDO
        style: TEXT_DASHED
        placement: BELOW
        controllerStartId: "ctl-16"
        controllerEndId: "ctl-17"

