# Test: Cross-Staff Note Rendering
# Exercises rendering.crossStaffOffset on a piano grand staff:
#  - M1: left hand beams UP onto the treble staff (bass -> treble), interleaved stems,
#        overlapping the right hand's whole note (multi-voice on treble).
#  - M2: right hand beams DOWN onto the bass staff (treble -> bass), interleaved stems,
#        overlapping the left hand's whole note (multi-voice on bass).
#  - M3: a same-staff tie (treble E5-E5, renders) and a cross-staff tie
#        (LH B3 borrowed to treble -> B3 on bass: different staves => let-ring).
#  - M4: a phrasing slur within the LH voice spanning the bass->treble boundary.

