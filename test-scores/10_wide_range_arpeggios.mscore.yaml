# 大范围琶音测试乐谱
# 测试类似李斯特作品中的快速琶音渲染
# 包含：上行、下行、高-低-高、低-高-低 四种模式

id: "wide_range_arpeggios_test"
metadata:
  title: "Wide Range Arpeggios Test"
  composer: "Test Suite"
  description: "测试大范围琶音的符杠、符干方向、加线渲染"

defaultTimeSignature: { numerator: 4, denominator: 4 }
defaultKeySignature: { root: 0, mode: MAJOR }
defaultTempo: 120.0

measures:
  - { number: 1 }  # 上行琶音 (C3 → C8)
  - { number: 2 }  # 下行琶音 (C8 → C3)
  - { number: 3 }  # 高-低-高 (C6 → C3 → C6)
  - { number: 4 }  # 低-高-低 (C3 → C6 → C3)

