# Test: Articulation Rendering
# Tests:
#   M1) All 5 marks, stem UP  → drawn on the notehead side = BELOW
#       (Staccato / Tenuto / Accent / Marcato)
#   M2) Stem DOWN → notehead side = ABOVE; incl. Spiccato and stacked
#       combinations (Accent+Staccato, Marcato+Staccato)
#   M3) Placement override = STEM → marks drawn at the stem-tip end
#   M4) Slur avoidance: eight staccato eighths under one slur (stem up →
#       slur bows BELOW, must clear the staccato dots)
#   M5) Chord articulations (Accent+Staccato on a chord, Marcato on a chord)
#
# Articulations live on the PitchEvent (musical info); the notehead-vs-stem
# placement choice lives on the VoiceEvent's rendering.articulationPlacement.

