    - type: timeSignatureChange
      onset:
        components:
          - numerator: 2
            denominator: 1
          - numerator: 0
            denominator: 1
      timeSignature:
        numerator: 3
        denominator: 4
    # M3: 3/4 → 6/8
    - type: timeSignatureChange
      onset:
        components:
          - numerator: 3
            denominator: 1
          - numerator: 0
            denominator: 1
      timeSignature:
        numerator: 6
        denominator: 8
    # M4: 6/8 → 4/4
    - type: timeSignatureChange
      onset:
        components:
          - numerator: 4
            denominator: 1
          - numerator: 0
            denominator: 1
      timeSignature:
        numerator: 4
        denominator: 4
