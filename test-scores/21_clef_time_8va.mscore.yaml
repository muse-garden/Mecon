staffTracks:
  "st-treble":
    id: "st-treble"
    name: "Treble Staff"
    clef: TREBLE
    keySignature:
      root: 0
      mode: MAJOR
    voiceTrackIds:
      - "vt-main"
    # ── Clef changes ────────────────────────────────────────────────────────
    clefChanges:
      # M6: switch to bass clef
      - onset:
          components:
            - numerator: 6
              denominator: 1
            - numerator: 0
              denominator: 1
        clef: BASS
      # M8: return to treble clef
      - onset:
          components:
            - numerator: 8
              denominator: 1
            - numerator: 0
              denominator: 1
        clef: TREBLE
    # ── 8va/8vb brackets (staff attachments) ────────────────────────────────
    attachments:
      # 8va start: M9 beat 1
      - type: octaveShiftStart
        id: "osa-001"
        onset:
          components:
            - numerator: 9
              denominator: 1
            - numerator: 0
              denominator: 1
        shiftType: OTTAVA
        endEventId: "ose-001"
        placement: ABOVE
      # 8va end: M11 beat 1
      - type: octaveShiftEnd
        id: "ose-001"
        onset:
          components:
            - numerator: 11
              denominator: 1
            - numerator: 0
              denominator: 1
        placement: ABOVE
      # 8vb start: M11 beat 1
      - type: octaveShiftStart
        id: "osa-002"
        onset:
          components:
            - numerator: 11
              denominator: 1
            - numerator: 0
              denominator: 1
        shiftType: OTTAVA_BASSA
        endEventId: "ose-002"
        placement: BELOW
      # 8vb end: M13 beat 1 (after last note)
      - type: octaveShiftEnd
        id: "ose-002"
        onset:
          components:
            - numerator: 13
              denominator: 1
            - numerator: 0
              denominator: 1
        placement: BELOW

