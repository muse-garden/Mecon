# Test: Clef Changes, Time Signature Changes, 8va/8vb
# Tests mid-score clef changes on staffTrack, time signature changes on globalTrack,
# and 8va/8vb octave-shift brackets stored as staff attachments.
#
# ── Section 1 (M1-4): Time signature changes ────────────────────────────────
#   M1: 4/4  (default)          — whole note C4
#   M2: 3/4  (→ from globalTrack events)  — dotted half D4
#   M3: 6/8  (→ from globalTrack events)  — dotted half E4 (fills 6/8)
#   M4: 4/4  (→ back)           — whole note F4
#
# ── Section 2 (M5-8): Clef changes on staffTrack ────────────────────────────
#   M5: treble (initial)        — whole note G4
#   M6: bass clef change        — whole note G2 (C4 diatonic step 0 in bass = G2?)
#                                 actually B2 in bass = diatonic 6 below C4 middle
#   M7: bass continues          — whole note A2
#   M8: back to treble          — whole note C5
#
# ── Section 3 (M9-12): 8va and 8vb brackets ────────────────────────────────
#   M9-10:  8va bracket (play octave higher)
#   M11-12: 8vb bracket (play octave lower)

id: "test-clef-time-8va-001"

metadata:
  title: "Clef Changes, Time Signatures & Octave Shifts"
  subtitle: "Mid-score clef changes, time sig changes, 8va/8vb"
  composer: "Test"
  createdAt: 1748200000000
  modifiedAt: 1748200000000

