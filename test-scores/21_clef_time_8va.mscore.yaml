            - numerator: 2
              denominator: 4
        pitches:
          - diatonicSteps: 4
            chromaticOffset: 0   # G4

      # ── M4: 4/4 — F4 (whole) ─────────────────────────────────────────────
      - id: "pe-006"
        onset:
          components:
            - numerator: 4
              denominator: 1
            - numerator: 0
              denominator: 1
        pitches:
          - diatonicSteps: 3
            chromaticOffset: 0   # F4

      # ── M5: treble — G4 (whole) ───────────────────────────────────────────
      - id: "pe-007"
        onset:
          components:
            - numerator: 5
              denominator: 1
            - numerator: 0
              denominator: 1
        pitches:
          - diatonicSteps: 4
            chromaticOffset: 0   # G4

      # ── M6: bass clef — G2 (whole); diatonicSteps=-5 from C4 = G2 ─────────
      - id: "pe-008"
        onset:
          components:
            - numerator: 6
              denominator: 1
            - numerator: 0
              denominator: 1
        pitches:
          - diatonicSteps: -5
            chromaticOffset: 0   # G2

      # ── M7: bass continues — A2 ───────────────────────────────────────────
      - id: "pe-009"
        onset:
          components:
            - numerator: 7
              denominator: 1
            - numerator: 0
              denominator: 1
        pitches:
          - diatonicSteps: -4
            chromaticOffset: 0   # A2

      # ── M8: treble returns — C5 ───────────────────────────────────────────
      - id: "pe-010"
        onset:
          components:
            - numerator: 8
              denominator: 1
            - numerator: 0
              denominator: 1
        pitches:
          - diatonicSteps: 7
            chromaticOffset: 0   # C5

      # ── M9: 8va start — E5 (whole) ────────────────────────────────────────
      - id: "pe-011"
        onset:
          components:
            - numerator: 9
              denominator: 1
            - numerator: 0
              denominator: 1
        pitches:
          - diatonicSteps: 9
            chromaticOffset: 0   # E5

      # ── M10: 8va end — G5 (whole) ─────────────────────────────────────────
      - id: "pe-012"
        onset:
          components:
            - numerator: 10
              denominator: 1
            - numerator: 0
              denominator: 1
        pitches:
          - diatonicSteps: 11
            chromaticOffset: 0   # G5

      # ── M11: 8vb start — C3 (whole) ───────────────────────────────────────
      - id: "pe-013"
        onset:
          components:
            - numerator: 11
              denominator: 1
            - numerator: 0
              denominator: 1
        pitches:
          - diatonicSteps: -7
            chromaticOffset: 0   # C3

      # ── M12: 8vb end — A2 (whole) ─────────────────────────────────────────
      - id: "pe-014"
        onset:
          components:
            - numerator: 12
              denominator: 1
            - numerator: 0
              denominator: 1
        pitches:
          - diatonicSteps: -4
            chromaticOffset: 0   # A2

