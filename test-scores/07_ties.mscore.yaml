# Test: Tie Rendering (Extended Coverage)
# Tests:
#   1) Chord ties (full and partial)
#   2) Cross-bar ties
#   3) Multi-voice ties (each voice has independent ties)
#   4) Let-ring (laissez vibrer) — ties with no target

