# Test: Complex Key Signatures
# Tests mid-score key signature changes covering:
#   - Dramatic sharp↔flat jumps; double sharps (##), double flats (bb), naturals (♮)
#   - Gradual sharp additions   (多升号): C→G→D→A   (0→1→2→3♯)
#   - Gradual sharp removals    (少升号): A→D→G→C   (3→2→1→0♯)
#   - Gradual flat additions    (多降号): C→F→Bb→Eb (0→1→2→3♭)
#   - Gradual flat removals     (少降号): Eb→Bb→F→C (3→2→1→0♭)
#
# ── Section 1 (M1-12): sharp↔flat jumps + chromatic accidentals ────────────
#   M1-2:  E major   (4♯)  ─┐
#   M3-4:  Ab major  (4♭)  ←┘ sharp→flat
#   M5-6:  B major   (5♯)  ←  flat→sharp
#   M7-8:  Bb major  (2♭)  ←  sharp→flat
#   M9-10: A major   (3♯)  ←  flat→sharp
#   M11-12:Eb major  (3♭)  ←  sharp→flat
#
# ── Section 2 (M13-28): stepwise modulations along the circle of fifths ─────
#   M13:   C major   (0)   reset                   (多升号 anchor)
#   M14:   G major   (1♯)  +1♯ (F#)
#   M15:   D major   (2♯)  +1♯ (C#)
#   M16:   A major   (3♯)  +1♯ (G#)
#   M17:   A major   (3♯)  continues               (少升号 anchor)
#   M18:   D major   (2♯)  -1♯
#   M19:   G major   (1♯)  -1♯
#   M20:   C major   (0)   -1♯  back to C
#   M21:   C major   (0)   continues               (多降号 anchor)
#   M22:   F major   (1♭)  +1♭ (Bb)
#   M23:   Bb major  (2♭)  +1♭ (Eb)
#   M24:   Eb major  (3♭)  +1♭ (Ab)
#   M25:   Eb major  (3♭)  continues               (少降号 anchor)
#   M26:   Bb major  (2♭)  -1♭
#   M27:   F major   (1♭)  -1♭
#   M28:   C major   (0)   -1♭  back to C

