# Test: Grace Notes — Ties and Slurs
# Tests:
#   M1: grace→grace tie  — g1 C4 (tied) → g2 C4 → principal D4
#   M2: grace→principal tie  — g1 E4 (tied) → principal E4 → F4, G4
#   M3: chord grace with multi-pitch tie  — g1 (C4+E4) pitchIndex 0 and 1 both tied → principal (C4+E4)
#   M4: slur from grace to principal only  — g1 C4 (slurStarts:1) → D4 (slurEnds:1) → E4, F4 half
#   M5: slur from grace spanning multiple notes  — g1 C4 (slurStarts:1) → D4 E4 F4 → G4 (slurEnds:1)
#
# Tie resolution uses TieTargetComputer.resolveGraceTieTarget:
#   omitting targetEventId lets the engine auto-resolve within the same (measure, beat).

